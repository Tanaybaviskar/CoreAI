version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coreai
      POSTGRES_PASSWORD: coreai
      POSTGRES_DB: coreai
    ports:
      - "5433:5432"
    volumes:
      - coreai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreai"]
      interval: 5s
      timeout: 5s
      retries: 5

  agentic:
    build: ./backend/agentic
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://coreai:coreai@db:5432/coreai
    env_file:
      - ./backend/agentic/.env
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - agentic

volumes:
  coreai_pgdata:
